modLoader="javafml"
loaderVersion="[47,)"
license="MIT"

[[mods]]
modId="fphudconfig"
version="1.0.2"
displayName="FP HUD Config"
authors="takapii"
displayTest="IGNORE_SERVER_VERSION"
description='''
Client-side addon: move / toggle Fracture Point's plate icon & plate durability bars
and TACZ Arm Stamina's stamina bar from a client config file.
Fracture Point のプレートアイコン/プレート耐久バーと、TACZ Arm Stamina のスタミナバーの
表示位置・オンオフをクライアントコンフィグで変更するアドオン。
'''

[[mixins]]
config="fphudconfig.mixins.json"

[[dependencies.fphudconfig]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="CLIENT"

[[dependencies.fphudconfig]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.21)"
ordering="NONE"
side="CLIENT"

[[dependencies.fphudconfig]]
modId="fracturepoint"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.fphudconfig]]
modId="tacz_arm_stamina"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"
